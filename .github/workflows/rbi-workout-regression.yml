name: RBI Workout Regression Tests

on:
  push:
    branches: [main]
    paths:
      - 'bharatiya_vyapari_FINAL (2).html'
      - 'tests/rbi-workout-regression.test.js'
      - 'tests/trade-consent-regression.test.js'
      - 'tests/gameplay-regression.test.js'
      - 'tests/situational-dialogue-regression.test.js'
      - 'tests/indexeddb-save-resume.test.js'
      - '.github/workflows/rbi-workout-regression.yml'
  pull_request:
    branches: [main]
    paths:
      - 'bharatiya_vyapari_FINAL (2).html'
      - 'tests/rbi-workout-regression.test.js'
      - 'tests/trade-consent-regression.test.js'
      - 'tests/gameplay-regression.test.js'
      - 'tests/situational-dialogue-regression.test.js'
      - '.github/workflows/rbi-workout-regression.yml'

jobs:
  rbi-workout-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run RBI workout regression tests
        run: node tests/rbi-workout-regression.test.js
      - name: Run human trade-consent regression tests
        run: node tests/trade-consent-regression.test.js
      - name: Run auction, rent, payment and bankruptcy regressions
        run: node tests/gameplay-regression.test.js
      - name: Run situational live-dialogue regression tests
        run: node tests/situational-dialogue-regression.test.js
      - name: Run IndexedDB save/resume regression tests
        run: node tests/indexeddb-save-resume.test.js
